<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- maximum-scale/user-scalable + 页 css 的 touch-action 双保险: 访客双击/两指
     捏不放大 (1.8.6, 用户点名「不能放大缩小界面」; app 靠 body pan-y 收口) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg">
<!--og-->
<title>分享 · My Music</title>
<link rel="stylesheet" href="/music/static/css/share-viewer-page.css?v=5">
<link rel="stylesheet" href="/music/static/css/share-viewer-player.css?v=11">
<!-- 1.8.130 全屏播放页样式直接用应用那份 (用户点名「样式和普通播放页面
     一样」): 不再自己 fork 一整份, 应用改版分享页自动跟上; 分享侧小补丁
     (迷你条/氛围底占位/队列行封面条/toast) 在 share-viewer-player.css -->
<link rel="stylesheet" href="/music/static/css/music-player.css?v=26">
<link rel="stylesheet" href="/music/static/css/music-player-quality.css?v=1">
<link rel="stylesheet" href="/music/static/css/music-queue.css?v=6">
</head>
<body>

<div class="share-mark"><a href="/music">♪ My Music</a></div>
<main>
  <section id="share-error" hidden>
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M9 17H7A5 5 0 1 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h3M13.5 12h2.5"/>
    </svg>
    <h1>链接不存在或已过期</h1>
    <p>分享链接在创建 24 小时后失效</p>
  </section>

  <section id="share-card" hidden>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    <!-- [html-validate-disable-next empty-heading -- 标题由分享元数据在运行时填充] -->
    <h1 id="share-title"></h1>
    <p id="share-subtitle"></p>
    <button type="button" id="hero-play" aria-label="播放">
      <svg id="ic-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
      </svg>
      <svg id="ic-pause" viewBox="0 0 24 24" hidden aria-hidden="true">
        <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
      </svg>
    </button>
    <div class="list-head" id="list-head" hidden></div>
    <div id="share-list"></div>
    <p class="expire" id="share-expire"></p>
  </section>
</main>

<div id="player" hidden>
  <div class="p-seek">
    <span id="t-now">0:00</span>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0"
           aria-label="播放进度">
    <span id="t-total">-:--</span>
  </div>
  <div class="p-main">
    <div class="p-art" id="p-art" aria-hidden="true"></div>
    <div class="p-text" id="p-text"><b id="p-title"></b><span id="p-artist"></span></div>
    <button type="button" id="p-toggle" aria-label="播放/暂停">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="use-play" d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
        <g class="use-pause">
          <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
          <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        </g>
      </svg>
    </button>
  </div>
</div>

<!-- 1.8.130 全屏播放页 (用户点名「样式和普通播放页面一样, 3d切换封面,
     按钮也跟普通播放界面保持一致」): 结构成应用 music.html #full-player
     同款 —— 封面舞台三张卡 (上一首/当前/下一首, 左右滑跟手切歌, 摆姿的
     JS 整用 music-player-art-stage, 取址在 share-viewer-stage 换成走
     分享 token 的公开路由), 传输三键站进度条上方, 底排 循环/歌词/队列
     三键 (三态循环: 列表→单曲→随机); 待播队列翻开占封面区 (分享清单即
     队列, 点行跳播)。封面下的音质行也有 (music-player-quality 整用,
     取址同样在 share-viewer-stage 改写走 /share/{token}/quality 公开
     路由 —— 应用的取数口要登录会话, 访客没有)。没带的: 菜单键 (动作
     都要登录) / 音量条 (键鼠端专属)。 -->
<div id="full-player" hidden>
  <div class="fp-bg ph" id="fp-bg" aria-hidden="true"><img id="fp-bg-img" alt=""></div>
  <div class="fp-sheet">
    <button type="button" id="fp-grab" aria-label="收起播放页"><span></span></button>
    <div class="fp-body">
      <div id="fp-art-wrap"><img id="fp-art-prev" class="art-card" alt="">
        <img id="fp-art-next" class="art-card" alt="">
        <img id="fp-art" class="art-card" alt=""><small id="fp-quality-prev" class="art-quality" hidden></small><small id="fp-quality-next" class="art-quality" hidden></small><small id="fp-quality" class="art-quality" hidden></small></div>
      <div id="fp-lyrics" hidden></div>
      <div id="fp-queue" hidden>
        <div class="fq-head">
          <div class="fq-head-txt"><b>继续播放</b><small id="fq-count"></small></div>
        </div>
        <div id="queue-list"></div>
      </div>
      <button type="button" id="lyrics-resume" hidden>回到当前句</button>
    </div>
    <div class="fp-meta">
      <div class="fp-now"><b id="fp-title"></b><small id="fp-artist"></small></div>
    </div>
    <div class="fp-controls">
      <button type="button" id="fp-prev" aria-label="上一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M21.981 6.098L14.6 10.949Q13 12 14.6 13.051L21.981 17.902Q23.5 18.9 23.5 17.082L23.5 6.918Q23.5 5.1 21.981 6.098M9.481 6.098L2.1 10.949Q0.5 12 2.1 13.051L9.481 17.902Q11 18.9 11 17.082L11 6.918Q11 5.1 9.481 6.098" fill="currentColor"/></svg></button>
      <button type="button" id="fp-play" aria-label="播放/暂停"></button>
      <button type="button" id="fp-next" aria-label="下一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M2.019 6.098L9.4 10.949Q11 12 9.4 13.051L2.019 17.902Q0.5 18.9 0.5 17.082L0.5 6.918Q0.5 5.1 2.019 6.098zM14.519 6.098L21.9 10.949Q23.5 12 21.9 13.051L14.519 17.902Q13 18.9 13 17.082L13 6.918Q13 5.1 14.519 6.098z" fill="currentColor"/></svg></button>
    </div>
    <div class="fp-transport">
      <span class="fp-time" id="fp-time-cur">-0:00</span>
      <div class="fp-scrub"><input id="fp-scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="进度"></div>
      <span class="fp-time" id="fp-time-total">-0:00</span>
    </div>
    <div class="fp-actions">
      <button type="button" id="fp-mode-btn" aria-label="循环模式"><svg viewBox="-1.72 -154.37 1329.4 1329.4" width="24" height="24" aria-hidden="true"><path d="M73.44 667.21a44.45 44.45 0 0 1 -12.12 1.64c-20.72 0 -38.18 -13.89 -43.62 -32.86c-9.37 -32.57 -14.71 -69.64 -14.71 -107.94v-0.42c0 -107.44 41.81 -208.46 117.8 -284.45C193.18 170.41 293.39 125.38 404.12 125.38h423.25V44.7c0 -25.71 17.68 -35.37 39.37 -21.36l194.36 125.48c21.64 14.01 21.41 36.56 -0.51 50.11L867.2 318.72c-21.92 13.61 -39.9 3.68 -39.9 -22.15V216.23h-422.04c-172.1 0.19 -311.55 139.75 -311.55 311.87c0 29.62 4.13 58.28 11.84 85.43c0.51 1.43 1.11 5.6 1.11 9.91a45.38 45.38 0 0 1 -32.91 43.63l-0.32 0.14zm1044.89 -282.16q14.66 52.96 14.63 107.91c0 107.4 -41.81 208.42 -117.8 284.42c-72.4 72.77 -172.6 117.8 -283.33 117.8H308.59v80.79c0 25.71 -17.68 35.37 -39.38 21.42l-194.3 -125.55c-21.64 -14.01 -21.47 -36.56 0.45 -50.11l193.45 -119.78c21.87 -13.62 39.83 -3.68 39.83 22.14v80.34h422.05c172.09 -0.18 311.54 -139.75 311.54 -311.87c0 -29.62 -4.12 -58.28 -11.84 -85.42c-0.36 -1.17 -0.88 -5.04 -0.88 -9.03a45.37 45.37 0 0 1 88.73 -13.38l0.09 0.32z" fill="currentColor"/></svg></button>
      <button type="button" id="fp-lyrics-btn" aria-label="歌词" disabled><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M11.049 7.801L11.049 13.662Q11.406 15.378 10.242 16.689Q9.078 18 7.332 17.848Q7.244 17.9 7.146 17.87Q7.049 17.84 7.005 17.748Q6.9 17.71 6.858 17.608Q6.815 17.505 6.863 17.404L6.863 15.73Q6.83 15.576 6.931 15.454Q7.032 15.333 7.189 15.336Q7.857 15.352 8.276 14.832Q8.695 14.311 8.537 13.662L8.537 12.825L6.026 12.825Q5.286 12.952 4.755 12.421Q4.224 11.89 4.351 11.15L4.351 7.801Q4.224 7.062 4.755 6.531Q5.286 6 6.026 6.127L9.375 6.127Q10.114 6 10.645 6.531Q11.176 7.062 11.049 7.801L11.049 7.801M17.747 6.127L14.398 6.127Q13.658 6 13.127 6.531Q12.597 7.062 12.723 7.801L12.723 11.15Q12.597 11.89 13.127 12.421Q13.658 12.952 14.398 12.825L16.91 12.825L16.91 13.662Q17.068 14.311 16.649 14.832Q16.23 15.352 15.562 15.336Q15.399 15.335 15.298 15.462Q15.197 15.589 15.235 15.747L15.235 17.421Q15.194 17.517 15.236 17.611Q15.279 17.706 15.377 17.739Q15.421 17.832 15.518 17.862Q15.616 17.892 15.704 17.84Q17.448 17.992 18.612 16.684Q19.776 15.376 19.421 13.662L19.421 7.801Q19.548 7.062 19.017 6.531Q18.487 6 17.747 6.127L17.747 6.127" fill="currentColor"/></svg></button>
      <button type="button" id="fp-queue-btn" aria-label="播放队列"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3.0005 5.016H17.9995Q18.984 5.016 18.984 6.0005Q18.984 6.985 17.9995 6.985H3.0005Q2.016 6.985 2.016 6.0005Q2.016 5.016 3.0005 5.016zM3.024 9H17.976Q18.984 9 18.984 10.008Q18.984 11.016 17.976 11.016H3.024Q2.016 11.016 2.016 10.008Q2.016 9 3.024 9zM3.0315 12.969H13.9845Q15 12.969 15 13.9845Q15 15 13.9845 15H3.0315Q2.016 15 2.016 13.9845Q2.016 12.969 3.0315 12.969zM17.801 13.445L21.185 15.499Q21.984 15.984 21.183 16.467L17.802 18.509Q17.016 18.984 17.016 18.065L17.016 13.887Q17.016 12.969 17.801 13.445z" fill="currentColor"/></svg></button>
    </div>
    <div class="fp-pad"></div>
  </div>
</div>

<div id="toast" hidden></div>

<audio id="audio" playsinline></audio>

<script src="/music/static/js/lyrics-parser.js?v=1"></script>
<!-- 队列模型/通用件/舞台摆姿/进度条命中垫 全用应用那份 (纯逻辑, 页面
     无关): 排在最前 —— share-viewer-data 起要使它们的 $ / 图标常量 -->
<script src="/music/static/js/player-queue.js?v=4"></script>
<script src="/music/static/js/music-common.js?v=23"></script>
<script src="/music/static/js/music-player-art-stage.js?v=9"></script>
<script src="/music/static/js/music-player-quality.js?v=2"></script>
<script src="/music/static/js/music-player-slider.js?v=1"></script>
<script src="/music/static/js/share/share-viewer-data.js?v=6"></script>
<script src="/music/static/js/share/share-viewer-stage.js?v=2"></script>
<script src="/music/static/js/share/share-viewer-playback.js?v=9"></script>
<script src="/music/static/js/share/share-viewer-queue.js?v=1"></script>
<script src="/music/static/js/share/share-viewer-fullpage.js?v=5"></script>
<script src="/music/static/js/share/share-viewer-lyrics.js?v=11"></script>
<script src="/music/static/js/share/share-viewer-events.js?v=7"></script>
</body>
</html>
