<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- maximum-scale/user-scalable + 页 css 的 touch-action 双保险: 访客双击/两指
     捏不放大 (1.8.6, 用户点名「不能放大缩小界面」; app 靠 body pan-y 收口) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/music/static/favicon.svg">
<!--og-->
<title>分享 · My Music</title>
<link rel="stylesheet" href="/music/static/css/share-viewer-page.css?v=5">
<link rel="stylesheet" href="/music/static/css/share-viewer-player.css?v=10">
</head>
<body>

<div class="share-mark"><a href="/music">♪ My Music</a></div>
<main>
  <section id="share-error" hidden>
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M9 17H7A5 5 0 1 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h3M13.5 12h2.5"/>
    </svg>
    <h1>链接不存在或已过期</h1>
    <p>分享链接在创建 24 小时后失效</p>
  </section>

  <section id="share-card" hidden>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    <!-- [html-validate-disable-next empty-heading -- 标题由分享元数据在运行时填充] -->
    <h1 id="share-title"></h1>
    <p id="share-subtitle"></p>
    <button type="button" id="hero-play" aria-label="播放">
      <svg id="ic-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
      </svg>
      <svg id="ic-pause" viewBox="0 0 24 24" hidden aria-hidden="true">
        <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
      </svg>
    </button>
    <div class="list-head" id="list-head" hidden></div>
    <div id="share-list"></div>
    <p class="expire" id="share-expire"></p>
  </section>
</main>

<div id="player" hidden>
  <div class="p-seek">
    <span id="t-now">0:00</span>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0"
           aria-label="播放进度">
    <span id="t-total">-:--</span>
  </div>
  <div class="p-main">
    <div class="p-art" id="p-art" aria-hidden="true"></div>
    <div class="p-text" id="p-text"><b id="p-title"></b><span id="p-artist"></span></div>
    <button type="button" id="p-toggle" aria-label="播放/暂停">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="use-play" d="M8.2 5.1c0-1.2 1.3-1.9 2.3-1.3l10.1 6.4c1 .6 1 2 0 2.6L10.5 19.2c-1 .6-2.3-.1-2.3-1.3V5.1z" fill="currentColor"/>
        <g class="use-pause">
          <rect x="6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
          <rect x="13.6" y="4.5" width="4.4" height="15" rx="2.2" fill="currentColor"/>
        </g>
      </svg>
    </button>
  </div>
</div>

<div id="fp" hidden>
  <div class="fp-bg ph" id="fp-bg" aria-hidden="true"><img id="fp-bg-img" alt=""></div>
  <div class="fp-sheet">
    <button type="button" id="fp-grab" aria-label="收起播放页"><span></span></button>
    <div class="fp-body">
      <div id="fp-art-wrap"><img id="fp-art" alt=""></div>
      <div id="fp-lyrics" hidden></div>
    </div>
    <div class="fp-meta">
      <img id="fp-artist-art" alt="" hidden>
      <div class="fp-now"><b id="fp-title"></b><small id="fp-artist"></small></div>
    </div>
    <!-- 1.8.37 中排键 (用户点名「歌词按钮放在标题和进度条中间, 旁边还有
         随机播放和循环播放」): 歌词键从标题行挪下来独占一排, 随机/循环
         与 app 播放队列头同款; 循环三态 关→列表→单曲 (单曲时图标带 "1",
         .one 组切换) -->
    <div class="fp-mid">
      <button type="button" id="fp-lyrics-btn" aria-label="歌词" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.049 7.801L11.049 13.662Q11.406 15.378 10.242 16.689Q9.078 18 7.332 17.848Q7.244 17.9 7.146 17.87Q7.049 17.84 7.005 17.748Q6.9 17.71 6.858 17.608Q6.815 17.505 6.863 17.404L6.863 15.73Q6.83 15.576 6.931 15.454Q7.032 15.333 7.189 15.336Q7.857 15.352 8.276 14.832Q8.695 14.311 8.537 13.662L8.537 12.825L6.026 12.825Q5.286 12.952 4.755 12.421Q4.224 11.89 4.351 11.15L4.351 7.801Q4.224 7.062 4.755 6.531Q5.286 6 6.026 6.127L9.375 6.127Q10.114 6 10.645 6.531Q11.176 7.062 11.049 7.801L11.049 7.801M17.747 6.127L14.398 6.127Q13.658 6 13.127 6.531Q12.597 7.062 12.723 7.801L12.723 11.15Q12.597 11.89 13.127 12.421Q13.658 12.952 14.398 12.825L16.91 12.825L16.91 13.662Q17.068 14.311 16.649 14.832Q16.23 15.352 15.562 15.336Q15.399 15.335 15.298 15.462Q15.197 15.589 15.235 15.747L15.235 17.421Q15.194 17.517 15.236 17.611Q15.279 17.706 15.377 17.739Q15.421 17.832 15.518 17.862Q15.616 17.892 15.704 17.84Q17.448 17.992 18.612 16.684Q19.776 15.376 19.421 13.662L19.421 7.801Q19.548 7.062 19.017 6.531Q18.487 6 17.747 6.127L17.747 6.127" fill="currentColor"/></svg>
      </button>
      <button type="button" id="fp-shuffle" aria-label="随机播放">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16.5 3q0.31 0 0.533 0.223l3 3q0.217 0.217 0.217 0.527q0 0.316-0.217 0.533l-3 3q-0.217 0.217-0.533 0.217q-0.31 0-0.53-0.22t-0.22-0.53q0-0.299 0.217-0.527l1.723-1.723l-1.19 0q-1.055 0-1.981 0.46t-1.552 1.257q-0.967 1.231-0.967 2.783q0 1.564-0.75 2.906q-0.398 0.721-0.967 1.295q-0.832 0.85-1.94 1.325t-2.344 0.475l-1.5 0q-0.31 0-0.53-0.22t-0.22-0.53t0.22-0.53t0.53-0.22l1.5 0q1.061 0 1.984-0.457t1.55-1.254q0.967-1.231 0.967-2.789q0-1.564 0.75-2.906q0.404-0.727 0.967-1.289q0.832-0.85 1.94-1.327t2.344-0.478l1.19 0l-1.723-1.717q-0.217-0.229-0.217-0.533q0-0.31 0.22-0.53t0.53-0.22zM16.5 13.5q0.31 0 0.533 0.223l3 3q0.217 0.217 0.217 0.533q0 0.31-0.217 0.527l-3 3q-0.217 0.217-0.533 0.217q-0.31 0-0.53-0.217t-0.22-0.527q0-0.305 0.217-0.533l1.723-1.723l-1.19 0q-1.236 0-2.344-0.475t-1.94-1.325q0.451-0.662 0.75-1.412q0.627 0.796 1.55 1.254t1.984 0.457l1.19 0l-1.723-1.717q-0.217-0.229-0.217-0.533q0-0.31 0.22-0.53t0.53-0.22zM4.5 6l1.5 0q1.236 0 2.344 0.478t1.94 1.327q-0.457 0.673-0.75 1.412q-0.627-0.796-1.552-1.257t-1.981-0.46l-1.5 0q-0.31 0-0.53-0.22t-0.22-0.53t0.22-0.53t0.53-0.22z" fill="currentColor"/></svg>
      </button>
      <button type="button" id="fp-repeat" aria-label="循环模式">
        <svg viewBox="0 0 1024 1024" width="18" height="18" aria-hidden="true"><path d="M640 810.666667H341.333333C187.733333 810.666667 64 686.933333 64 533.333333s123.733333-277.333333 277.333333-277.333333h597.333334c12.8 0 21.333333 8.533333 21.333333 21.333333s-8.533333 21.333333-21.333333 21.333334H341.333333C211.2 298.666667 106.666667 403.2 106.666667 533.333333s104.533333 234.666667 234.666666 234.666667h298.666667c85.333333 0 164.266667-38.4 217.6-104.533333 19.2-25.6 36.266667-53.333333 44.8-83.2 4.266667-14.933333 8.533333-29.866667 10.666667-42.666667 2.133333-10.666667 12.8-19.2 23.466666-17.066667 10.666667 2.133333 19.2 12.8 17.066667 23.466667-2.133333 17.066667-6.4 34.133333-12.8 51.2-12.8 34.133333-29.866667 68.266667-53.333333 96-57.6 74.666667-149.333333 119.466667-247.466667 119.466667z" fill="currentColor"/><path d="M810.666667 426.666667c-6.4 0-10.666667-2.133333-14.933334-6.4-8.533333-8.533333-8.533333-21.333333 0-29.866667l113.066667-113.066667-113.066667-113.066666c-8.533333-8.533333-8.533333-21.333333 0-29.866667s21.333333-8.533333 29.866667 0l128 128c8.533333 8.533333 8.533333 21.333333 0 29.866667l-128 128c-4.266667 4.266667-8.533333 6.4-14.933333 6.4z" fill="currentColor"/><g class="one"><path d="M512 682.666667c-12.8 0-21.333333-8.533333-21.333333-21.333334V405.333333c0-12.8 8.533333-21.333333 21.333333-21.333333s21.333333 8.533333 21.333333 21.333333v256c0 12.8-8.533333 21.333333-21.333333 21.333334z" fill="currentColor"/><path d="M416 522.666667c-6.4 0-10.666667-2.133333-14.933333-6.4-8.533333-8.533333-8.533333-21.333333 0-29.866667l96-96c8.533333-8.533333 21.333333-8.533333 29.866666 0s8.533333 21.333333 0 29.866667l-96 96c-4.266667 4.266667-8.533333 6.4-14.933333 6.4z" fill="currentColor"/></g></svg>
      </button>
    </div>
    <div class="fp-transport">
      <div class="fp-scrub-row">
        <span class="fp-time" id="fp-time-cur">-0:00</span>
        <div class="fp-scrub"><input id="fp-scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="进度"></div>
        <span class="fp-time" id="fp-time-total">-0:00</span>
      </div>
      <div class="fp-keys">
        <button type="button" id="fp-prev" aria-label="上一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M21.981 6.098L14.6 10.949Q13 12 14.6 13.051L21.981 17.902Q23.5 18.9 23.5 17.082L23.5 6.918Q23.5 5.1 21.981 6.098M9.481 6.098L2.1 10.949Q0.5 12 2.1 13.051L9.481 17.902Q11 18.9 11 17.082L11 6.918Q11 5.1 9.481 6.098" fill="currentColor"/></svg></button>
        <button type="button" id="fp-play" aria-label="播放/暂停"></button>
        <button type="button" id="fp-next" aria-label="下一首"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M2.019 6.098L9.4 10.949Q11 12 9.4 13.051L2.019 17.902Q0.5 18.9 0.5 17.082L0.5 6.918Q0.5 5.1 2.019 6.098zM14.519 6.098L21.9 10.949Q23.5 12 21.9 13.051L14.519 17.902Q13 18.9 13 17.082L13 6.918Q13 5.1 14.519 6.098z" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="fp-pad"></div>
  </div>
</div>

<audio id="audio" playsinline></audio>

<script src="/music/static/js/lyrics-parser.js?v=1"></script>
<script src="/music/static/js/share/share-viewer-data.js?v=5"></script>
<script src="/music/static/js/share/share-viewer-playback.js?v=7"></script>
<script src="/music/static/js/share/share-viewer-fullpage.js?v=4"></script>
<script src="/music/static/js/share/share-viewer-lyrics.js?v=9"></script>
<script src="/music/static/js/share/share-viewer-events.js?v=6"></script>
</body>
</html>
